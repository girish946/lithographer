name: build

on:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # liblitho is a path dependency at ../../litho (sibling of this repo).
      - name: Checkout litho
        run: git clone --depth 1 --branch refactor-v1 https://github.com/girish946/litho.git ../litho

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ../litho -> target

      - name: install frontend dependencies
        run: npm install

      - name: vendor frontend assets
        run: npm run vendor-assets

      # Omit tagName and releaseId to build only (no GitHub release upload).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bash scripts/tauri-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm