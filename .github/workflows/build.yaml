name: build

on:
  push:
    branches:
      - "*"
  pull_request:

env:
  LITHO_REPO: https://github.com/girish946/litho.git
  LITHO_BRANCH: windows-implementation

jobs:
  build-tauri-linux:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # liblitho is a path dependency at ../../litho (sibling of this repo).
      - name: Checkout litho
        run: git clone --depth 1 --branch "${{ env.LITHO_BRANCH }}" "${{ env.LITHO_REPO }}" ../litho

      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ../litho -> target

      - name: install frontend dependencies
        run: npm install

      - name: vendor frontend assets
        run: npm run vendor-assets

      - name: generate app icons
        run: npm run generate-icons

      # Omit tagName and releaseId to build only (no GitHub release upload).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bash scripts/tauri-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  build-tauri-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout litho
        shell: bash
        run: git clone --depth 1 --branch "${{ env.LITHO_BRANCH }}" "${{ env.LITHO_REPO }}" ../litho

      # litho links openssl-sys; the "light" Chocolatey package has no lib/ headers.
      - name: Install OpenSSL (Windows)
        shell: cmd
        run: choco install openssl -y --no-progress

      - name: Configure OpenSSL for openssl-sys
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files\OpenSSL-Win64',
            'C:\Program Files\OpenSSL'
          )
          $opensslDir = $null
          foreach ($dir in $candidates) {
            if ((Test-Path "$dir\lib") -and (Test-Path "$dir\include")) {
              $opensslDir = $dir
              break
            }
          }
          if (-not $opensslDir) {
            Write-Error "OpenSSL development files (lib/, include/) not found after choco install."
            Get-ChildItem 'C:\Program Files' | Where-Object { $_.Name -like '*OpenSSL*' }
            exit 1
          }
          Write-Host "Using OpenSSL at $opensslDir"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_DIR=$opensslDir"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_LIB_DIR=$opensslDir\lib"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_INCLUDE_DIR=$opensslDir\include"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ../litho -> target

      - name: install frontend dependencies
        run: npm install

      - name: vendor frontend assets
        run: npm run vendor-assets

      - name: generate app icons
        run: npm run generate-icons

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: powershell -ExecutionPolicy Bypass -File scripts/tauri-build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe