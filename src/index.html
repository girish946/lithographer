<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lithographer • SD Card Writer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');

        :root {
            --accent: #60a5fa;
        }

        html {
            height: 100%;
        }

        html[data-theme="dark"] {
            --bg: #09090b;
            --text: #e4e4e7;
            --text-strong: #ffffff;
            --text-muted: #a1a1aa;
            --text-faint: #71717a;
            --surface: #18181b;
            --surface-raised: #27272a;
            --surface-hover: #3f3f46;
            --border: #3f3f46;
            --border-subtle: #27272a;
            --card: rgba(15, 23, 42, 0.95);
            --chip: #27272a;
            --icon-btn-hover: #18181b;
            --footer-divider: #27272a;
            --mode-idle-bg: transparent;
            --mode-idle-border: #3f3f46;
            --mode-idle-hover: #52525b;
            --mode-active-bg: rgb(15, 23, 42);
            --mode-active-border: #60a5fa;
            --mode-active-text: #e0f2fe;
            --badge-unknown-bg: rgba(39, 39, 42, 0.8);
            --badge-unknown-text: #a1a1aa;
            --badge-unknown-border: #3f3f46;
        }

        html[data-theme="light"] {
            --bg: #f4f4f5;
            --text: #3f3f46;
            --text-strong: #09090b;
            --text-muted: #52525b;
            --text-faint: #71717a;
            --surface: #ffffff;
            --surface-raised: #fafafa;
            --surface-hover: #f4f4f5;
            --border: #d4d4d8;
            --border-subtle: #e4e4e7;
            --card: rgba(255, 255, 255, 0.96);
            --chip: #f4f4f5;
            --icon-btn-hover: #e4e4e7;
            --footer-divider: #d4d4d8;
            --mode-idle-bg: #fafafa;
            --mode-idle-border: #d4d4d8;
            --mode-idle-hover: #a1a1aa;
            --mode-active-bg: #eff6ff;
            --mode-active-border: #3b82f6;
            --mode-active-text: #1d4ed8;
            --badge-unknown-bg: #f4f4f5;
            --badge-unknown-text: #71717a;
            --badge-unknown-border: #d4d4d8;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100%;
            height: auto;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .logo-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .theme-title { color: var(--text-strong); }
        .theme-muted { color: var(--text-faint); }
        .theme-label { color: var(--text-muted); }
        .theme-footer { color: var(--text-faint); }
        .theme-footer a:hover { color: var(--text-muted); }

        .glass {
            background: var(--card);
            backdrop-filter: blur(20px);
            border-color: var(--border-subtle) !important;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .theme-select,
        .theme-file-btn,
        .theme-file-btn-secondary {
            background-color: var(--surface);
            border-color: var(--border);
            color: var(--text-strong);
        }

        .theme-file-btn:hover,
        .theme-file-btn-secondary:hover {
            background-color: var(--surface-hover);
            border-color: #3b82f6;
        }

        .theme-status-panel {
            background-color: color-mix(in srgb, var(--surface) 70%, transparent);
            border-color: var(--border-subtle);
        }

        .theme-progress-track { background-color: var(--surface-raised); }
        .theme-icon-btn:hover { background-color: var(--icon-btn-hover); }
        .theme-chip { background-color: var(--chip); }
        .theme-footer-divider { background-color: var(--footer-divider); }
        .theme-cancel-btn {
            background-color: var(--surface);
            border-color: color-mix(in srgb, #ef4444 30%, transparent);
        }
        .theme-cancel-btn:hover {
            background-color: #fef2f2;
            border-color: #ef4444;
        }

        html[data-theme="dark"] .theme-cancel-btn:hover {
            background-color: #450a0a;
        }

        .main-logo-wrap {
            background-color: var(--surface);
            border-color: var(--border);
        }

        .theme-icon-btn { color: var(--text-muted); }

        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (hover: hover) {
            .card:hover {
                transform: translateY(-4px);
                box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            }
        }

        .mode-option {
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .mode-option {
            background-color: var(--mode-idle-bg);
            border-color: var(--mode-idle-border);
            color: var(--text);
        }

        .mode-option:not(.active):hover {
            border-color: var(--mode-idle-hover);
        }

        .mode-option.active {
            background-color: var(--mode-active-bg);
            border-color: var(--mode-active-border);
            color: var(--mode-active-text);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--mode-active-border) 30%, transparent);
        }

        .privilege-badge--unknown {
            background-color: var(--badge-unknown-bg);
            color: var(--badge-unknown-text);
            border-color: var(--badge-unknown-border);
        }

        .progress-bar {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .terminal {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: clamp(0.75rem, 2.5vw, 0.85rem);
        }

        .app-shell {
            width: 100%;
            max-width: min(48rem, 100%);
        }

        .section-block {
            margin-bottom: 1.25rem;
        }

        @media (min-width: 640px) {
            .section-block {
                margin-bottom: 1.75rem;
            }
        }

        @media (max-width: 380px) {
            .mode-option .mode-icon-wrap {
                width: 2.5rem;
                height: 2.5rem;
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell mx-auto w-full px-3 sm:px-6 lg:px-8 py-3 sm:py-4 flex flex-col gap-4 sm:gap-6">
        <!-- Header -->
        <div class="main-header flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between shrink-0">
            <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                <div class="main-logo-wrap w-14 h-14 sm:w-16 sm:h-16 shrink-0 rounded-2xl flex items-center justify-center border overflow-hidden">
                    <img id="app-logo"
                         src="assets/dark-logo.jpg"
                         alt="Lithographer"
                         class="w-12 h-12 sm:w-14 sm:h-14 object-contain">
                </div>
                <div class="min-w-0">
                    <h1 class="main-title theme-title logo-font text-2xl sm:text-3xl font-semibold tracking-tighter truncate">lithographer</h1>
                    <p class="header-tagline theme-muted text-xs sm:text-sm -mt-0.5 truncate">SD Card • NVMe • USB Writer</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3 text-sm self-start sm:self-auto shrink-0">
                <div id="privilege-badge"
                     title="Checking privilege status..."
                     class="privilege-badge privilege-badge--unknown flex items-center gap-x-1.5 px-2.5 sm:px-3 py-1.5 rounded-full border">
                    <i id="privilege-icon" class="fa-solid fa-shield-halved text-xs"></i>
                    <span id="privilege-text" class="font-medium text-xs sm:text-sm">Checking…</span>
                </div>
                <button type="button" onclick="toggleTheme()" title="Toggle light/dark theme"
                     class="theme-icon-btn w-9 h-9 flex items-center justify-center rounded-xl cursor-pointer transition-colors">
                    <i id="theme-icon" class="fa-solid fa-sun"></i>
                </button>
            </div>
        </div>

        <div class="glass rounded-2xl sm:rounded-3xl border p-4 sm:p-6 lg:p-8 shadow-2xl">
            <!-- Mode Selection -->
            <div class="section-block">
                <label class="theme-label block text-xs sm:text-sm font-medium mb-2 sm:mb-3 tracking-widest">OPERATION MODE</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4" id="mode-select">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Device Selection -->
            <div class="section-block">
                <label class="theme-label block text-xs sm:text-sm font-medium mb-2 sm:mb-3 tracking-widest">TARGET DEVICE</label>
                <div class="relative">
                    <select id="diskSelect"
                            onchange="selectDevice(this)"
                            class="theme-select w-full border focus:border-blue-500 rounded-xl sm:rounded-2xl px-4 sm:px-5 py-3 sm:py-4 text-sm sm:text-base appearance-none focus:outline-none cursor-pointer">
                        <option value="">Select a storage device...</option>
                    </select>
                    <div class="pointer-events-none absolute right-4 sm:right-5 top-1/2 -translate-y-1/2 theme-muted">
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                </div>
                <div id="device-info" class="mt-2 sm:mt-3 text-xs theme-muted flex flex-wrap items-center gap-2"></div>
                <div id="fixed-device-warning"
                     class="hidden mt-2 sm:mt-3 flex items-start gap-2.5 p-3 sm:p-4 rounded-xl sm:rounded-2xl border border-amber-500/30 bg-amber-500/10 text-amber-500 text-xs sm:text-sm">
                    <i class="fa-solid fa-triangle-exclamation mt-0.5 shrink-0"></i>
                    <span>This device is not removable. Writing to it can destroy data.</span>
                </div>
            </div>

            <!-- File Selection -->
            <div class="section-block">
                <label class="theme-label block text-xs sm:text-sm font-medium mb-2 sm:mb-3 tracking-widest" id="file-label">SOURCE IMAGE</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <button type="button" onclick="selectFile()"
                            id="file-button"
                            class="theme-file-btn flex-1 min-w-0 border transition-all rounded-xl sm:rounded-2xl px-4 sm:px-6 py-3 sm:py-4 text-left flex items-center gap-x-3 group">
                        <div class="w-8 h-8 sm:w-9 sm:h-9 shrink-0 bg-blue-500/10 rounded-xl flex items-center justify-center text-blue-400 group-hover:scale-110 transition-transform">
                            <i id="file-icon" class="fa-solid fa-file-image"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div id="selected-file-name" class="text-sm font-medium theme-title truncate">No file selected</div>
                            <div id="selected-file-path" class="text-xs theme-muted truncate">Click to choose an image file</div>
                        </div>
                    </button>

                    <button type="button" onclick="selectFile()"
                            class="theme-file-btn-secondary sm:px-8 px-4 py-3 sm:py-0 border rounded-xl sm:rounded-2xl flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-solid fa-folder-open text-lg sm:text-xl"></i>
                        <span class="sm:hidden text-sm font-medium">Browse</span>
                    </button>
                </div>
            </div>

            <!-- Verification (flash only) -->
            <div id="verify-section" class="section-block">
                <label class="theme-label block text-xs sm:text-sm font-medium mb-2 sm:mb-3 tracking-widest">VERIFICATION</label>
                <label class="theme-file-btn flex items-start gap-3 border rounded-xl sm:rounded-2xl px-4 sm:px-5 py-3 sm:py-4 cursor-pointer">
                    <input type="checkbox"
                           id="verify-checkbox"
                           class="mt-1 h-4 w-4 rounded border-gray-500 text-blue-500 focus:ring-blue-500"
                           onchange="verifyChecksum = this.checked">
                    <span class="min-w-0">
                        <span class="block text-sm font-medium theme-title">Verify checksum after write</span>
                        <span class="block text-xs theme-muted mt-1">Reads the device back and compares SHA-256 checksums. Slower, but confirms the image was written correctly.</span>
                    </span>
                </label>
            </div>

            <!-- Status -->
            <div class="section-block theme-status-panel border rounded-xl sm:rounded-2xl p-4 sm:p-5 terminal">
                <div class="flex justify-between items-center text-xs mb-2 theme-muted gap-2">
                    <div>STATUS</div>
                    <div id="status-text" class="text-emerald-400 font-medium shrink-0">Ready</div>
                </div>
                <div id="status-detail" class="theme-label text-sm break-words">Waiting for operation...</div>
            </div>

            <!-- Progress -->
            <div class="section-block">
                <div class="flex justify-between text-xs theme-muted mb-2">
                    <div>PROGRESS</div>
                    <div id="progress-text" class="font-mono">0%</div>
                </div>
                <div class="theme-progress-track h-2 rounded-3xl overflow-hidden">
                    <div id="progress-bar"
                         class="progress-bar h-full bg-gradient-to-r from-blue-500 to-cyan-400 w-0 rounded-3xl"></div>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex flex-col-reverse sm:flex-row gap-3 sm:gap-4">
                <button type="button" onclick="startProcess()"
                        id="start-button"
                        class="control-primary flex-1 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 transition-all text-white font-semibold py-4 sm:py-5 rounded-2xl sm:rounded-3xl text-base sm:text-lg flex items-center justify-center gap-x-3 shadow-lg shadow-blue-500/30 active:scale-[0.985]">
                    <i class="fa-solid fa-play"></i>
                    <span id="start-text">START FLASH</span>
                </button>

                <button type="button" onclick="cancelProcess()"
                        id="cancel-button"
                        class="theme-cancel-btn hidden sm:px-8 px-4 py-4 sm:py-5 border text-red-400 hover:text-red-300 rounded-2xl sm:rounded-3xl font-medium transition-all">
                    CANCEL
                </button>
            </div>
        </div>

        <!-- Fixed-device confirmation (matches litho-tui NonRemovableConfirm) -->
        <div id="fixed-device-modal"
             class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6"
             role="dialog"
             aria-modal="true"
             aria-labelledby="fixed-device-modal-title">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="confirmFixedDeviceSelection(false)"></div>
            <div class="glass relative w-full max-w-md rounded-2xl sm:rounded-3xl border border-amber-500/30 p-5 sm:p-6 shadow-2xl">
                <div class="flex items-start gap-3 mb-4">
                    <div class="w-10 h-10 shrink-0 rounded-xl bg-amber-500/15 flex items-center justify-center text-amber-400">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <div class="min-w-0">
                        <h2 id="fixed-device-modal-title" class="theme-title font-semibold text-base sm:text-lg">Confirm device selection</h2>
                        <p class="theme-muted text-xs sm:text-sm mt-1">This device is not removable. Writing to it can destroy data.</p>
                    </div>
                </div>
                <p id="fixed-device-modal-name" class="theme-chip px-3 py-2 rounded-xl text-sm font-medium break-all mb-5"></p>
                <div class="flex flex-col-reverse sm:flex-row gap-3">
                    <button type="button"
                            onclick="confirmFixedDeviceSelection(false)"
                            class="theme-file-btn-secondary flex-1 border rounded-xl sm:rounded-2xl px-4 py-3 text-sm font-medium transition-colors">
                        Cancel
                    </button>
                    <button type="button"
                            onclick="confirmFixedDeviceSelection(true)"
                            class="flex-1 bg-amber-600 hover:bg-amber-500 transition-colors text-white font-semibold rounded-xl sm:rounded-2xl px-4 py-3 text-sm">
                        Continue
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="app-footer theme-footer text-center text-xs flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-5 pb-1">
            <div>Made with ❤️ by <a href="https://github.com/girish946" target="_blank">Girish Joshi</a></div>
            <div class="theme-footer-divider hidden sm:block w-px h-3"></div>
            <div class="flex items-center gap-x-1">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Root Required</span>
            </div>
        </div>
    </div>

    <script>
        let devices = [];
        let selectedMode = "flash";
        let selectedDevice = null;
        let selectedFile = null;
        let verifyChecksum = false;
        let isRunning = false;
        let lithoEventUnlisten = null;
        let pendingFixedDevice = null;
        const THEME_STORAGE_KEY = "lithographer-theme";

        const modes = [
            {
                id: "flash",
                label: "Flash Image",
                icon: "fa-solid fa-download",
                desc: "Write image to device"
            },
            {
                id: "clone",
                label: "Clone Disk",
                icon: "fa-solid fa-clone",
                desc: "Create image from device"
            }
        ];

        function tauriInvoke(cmd, args = {}) {
            if (!window.__TAURI__ || !window.__TAURI__.core) {
                return Promise.reject(new Error("Tauri backend unavailable"));
            }
            return window.__TAURI__.core.invoke(cmd, args);
        }

        function basename(path) {
            if (!path) return "";
            const parts = path.split(/[/\\]/);
            return parts[parts.length - 1] || path;
        }

        function setSelectedFile(path) {
            if (!path) return;
            selectedFile = {
                name: basename(path),
                path: path
            };

            document.getElementById("selected-file-name").textContent = selectedFile.name;
            document.getElementById("selected-file-path").textContent = selectedFile.path;
            document.getElementById("status-detail").innerHTML =
                `Selected: <span class="text-blue-400 break-all">${selectedFile.name}</span>`;
        }

        function updateFileSection() {
            const isClone = selectedMode === "clone";
            const label = document.getElementById("file-label");
            const placeholder = document.getElementById("selected-file-path");
            const icon = document.getElementById("file-icon");

            label.textContent = isClone ? "OUTPUT IMAGE" : "SOURCE IMAGE";
            icon.className = isClone ? "fa-solid fa-floppy-disk" : "fa-solid fa-file-image";

            if (!selectedFile) {
                placeholder.textContent = isClone
                    ? "Click to choose where to save the clone"
                    : "Click to choose an image file";
            }
        }

        function renderModes() {
            const container = document.getElementById("mode-select");
            container.innerHTML = "";

            modes.forEach(mode => {
                const div = document.createElement("div");
                div.className = `mode-option p-4 sm:p-6 rounded-2xl sm:rounded-3xl border cursor-pointer flex flex-col items-center text-center card ${mode.id === selectedMode ? "active" : ""}`;
                div.innerHTML = `
                    <div class="mode-icon-wrap w-10 h-10 sm:w-12 sm:h-12 bg-blue-500/10 rounded-2xl flex items-center justify-center mb-3 sm:mb-4 text-2xl sm:text-3xl text-blue-400">
                        <i class="${mode.icon}"></i>
                    </div>
                    <div class="mode-label font-semibold text-base sm:text-lg">${mode.label}</div>
                    <div class="mode-desc theme-muted text-xs sm:text-sm mt-1">${mode.desc}</div>
                `;
                div.onclick = () => {
                    if (selectedMode === mode.id) return;
                    selectedMode = mode.id;
                    selectedFile = null;
                    document.getElementById("selected-file-name").textContent = "No file selected";
                    document.getElementById("selected-file-path").textContent = "";
                    renderModes();
                    updateStartButton();
                    updateFileSection();
                    updateVerifySection();
                };
                container.appendChild(div);
            });
        }

        function sortDevicesRemovableFirst(list) {
            return [...list].sort((a, b) => {
                if (a.removable !== b.removable) {
                    return a.removable ? -1 : 1;
                }
                return a.path.localeCompare(b.path);
            });
        }

        function defaultDeviceIndex() {
            const removableIdx = devices.findIndex(d => d.removable);
            return removableIdx !== -1 ? removableIdx : (devices.length > 0 ? 0 : -1);
        }

        function deviceIndexByPath(path) {
            if (!path) return -1;
            return devices.findIndex(d => d.path === path || d.path.endsWith(path));
        }

        function updateDeviceInfo() {
            const infoEl = document.getElementById("device-info");
            const warningEl = document.getElementById("fixed-device-warning");

            if (!selectedDevice) {
                infoEl.innerHTML = "";
                warningEl.classList.add("hidden");
                return;
            }

            infoEl.innerHTML = `
                <span class="theme-chip px-2.5 py-1 rounded-lg break-all">${selectedDevice.path}</span>
                <span>${selectedDevice.size}</span>
                ${selectedDevice.removable
                    ? `<span class="text-emerald-400">● Removable</span>`
                    : `<span class="text-amber-400">● Fixed</span>`}
            `;

            if (selectedDevice.removable) {
                warningEl.classList.add("hidden");
            } else {
                warningEl.classList.remove("hidden");
            }
        }

        function applyDeviceSelection(index, selectEl) {
            if (index < 0 || index >= devices.length) {
                selectedDevice = null;
                if (selectEl) selectEl.value = "";
                updateDeviceInfo();
                return;
            }

            selectedDevice = devices[index];
            if (selectEl) selectEl.value = String(index);
            updateDeviceInfo();
        }

        function showFixedDeviceConfirm(device, index, selectEl, previousIndex) {
            pendingFixedDevice = { index, selectEl, previousIndex };
            document.getElementById("fixed-device-modal-name").textContent =
                `${device.name} • ${device.path}`;
            document.getElementById("fixed-device-modal").classList.remove("hidden");
        }

        function hideFixedDeviceConfirm() {
            document.getElementById("fixed-device-modal").classList.add("hidden");
            pendingFixedDevice = null;
        }

        function confirmFixedDeviceSelection(accept) {
            const pending = pendingFixedDevice;
            hideFixedDeviceConfirm();
            if (!pending) return;

            if (accept) {
                applyDeviceSelection(pending.index, pending.selectEl);
            } else if (pending.previousIndex >= 0) {
                applyDeviceSelection(pending.previousIndex, pending.selectEl);
            } else {
                applyDeviceSelection(-1, pending.selectEl);
            }
        }

        function populateDevices() {
            const select = document.getElementById("diskSelect");
            select.innerHTML = `<option value="">Select a storage device...</option>`;

            devices.forEach((device, index) => {
                const opt = document.createElement("option");
                opt.value = index;
                opt.textContent = `${device.name} • ${device.size} ${device.removable ? "(Removable)" : "(Fixed)"}`;
                select.appendChild(opt);
            });
        }

        function selectDevice(selectEl, options = {}) {
            const { skipConfirm = false } = options;

            if (!selectEl.value) {
                applyDeviceSelection(-1, selectEl);
                return;
            }

            const index = parseInt(selectEl.value, 10);
            const device = devices[index];
            if (!device) {
                applyDeviceSelection(-1, selectEl);
                return;
            }

            if (!device.removable && !skipConfirm) {
                const previousIndex = selectedDevice
                    ? deviceIndexByPath(selectedDevice.path)
                    : -1;
                if (previousIndex >= 0) {
                    selectEl.value = String(previousIndex);
                } else {
                    selectEl.value = "";
                }
                showFixedDeviceConfirm(device, index, selectEl, previousIndex);
                return;
            }

            applyDeviceSelection(index, selectEl);
        }

        async function selectFile() {
            if (isRunning) return;

            try {
                const path = await tauriInvoke("pick_image_path", { mode: selectedMode });
                if (path) {
                    setSelectedFile(path);
                }
            } catch (err) {
                console.error("File picker failed:", err);
                document.getElementById("status-detail").textContent =
                    "Could not open file picker. Run inside the Lithographer app.";
            }
        }

        function updateStartButton() {
            const btnText = document.getElementById("start-text");
            btnText.textContent = selectedMode === "flash" ? "START FLASH" : "START CLONE";
        }

        function updateVerifySection() {
            const section = document.getElementById("verify-section");
            const checkbox = document.getElementById("verify-checkbox");
            const show = selectedMode === "flash";
            section.classList.toggle("hidden", !show);
            checkbox.disabled = isRunning || !show;
            if (!show) {
                verifyChecksum = false;
                checkbox.checked = false;
            }
        }

        function applyPrivilegeBadge(kind, text, title) {
            const badge = document.getElementById("privilege-badge");
            const label = document.getElementById("privilege-text");
            const icon = document.getElementById("privilege-icon");

            const styles = {
                root: "privilege-badge flex items-center gap-x-1.5 px-2.5 sm:px-3 py-1.5 bg-emerald-500/10 text-emerald-400 rounded-full border border-emerald-500/20",
                polkit: "privilege-badge flex items-center gap-x-1.5 px-2.5 sm:px-3 py-1.5 bg-sky-500/10 text-sky-400 rounded-full border border-sky-500/20",
                unprivileged: "privilege-badge flex items-center gap-x-1.5 px-2.5 sm:px-3 py-1.5 bg-amber-500/10 text-amber-400 rounded-full border border-amber-500/20",
                unknown: "privilege-badge privilege-badge--unknown flex items-center gap-x-1.5 px-2.5 sm:px-3 py-1.5 rounded-full border",
            };

            const icons = {
                root: "fa-solid fa-user-shield",
                polkit: "fa-solid fa-key",
                unprivileged: "fa-solid fa-shield-halved",
                unknown: "fa-solid fa-circle-question",
            };

            badge.className = styles[kind] || styles.unknown;
            icon.className = `${icons[kind] || icons.unknown} text-xs`;
            label.textContent = text;
            badge.title = title;
        }

        async function loadPrivilegeStatus() {
            try {
                const diag = await tauriInvoke("get_startup_diagnostics");

                if (diag.is_root) {
                    applyPrivilegeBadge(
                        "root",
                        "Privileged",
                        "Running as root. Flash and clone can run without a password prompt."
                    );
                } else if (diag.polkit_agent_is_executable) {
                    applyPrivilegeBadge(
                        "polkit",
                        "Polkit ready",
                        "Not root. Starting an operation will prompt for your administrator password."
                    );
                } else {
                    applyPrivilegeBadge(
                        "unprivileged",
                        "Unprivileged",
                        "Not running as root and no polkit agent was detected. Use sudo or install a desktop polkit agent."
                    );
                }
            } catch (err) {
                console.warn("Failed to load privilege status:", err);
                applyPrivilegeBadge(
                    "unknown",
                    "Unknown",
                    "Could not determine privilege status."
                );
            }
        }

        async function loadStorageDevices() {
            const select = document.getElementById("diskSelect");
            if (!select) return;

            const previouslySelectedPath = (selectedDevice && selectedDevice.path) || null;
            select.innerHTML = `<option value="">Detecting storage devices...</option>`;

            try {
                const realDevices = await tauriInvoke("get_storage_devices");
                devices = sortDevicesRemovableFirst(Array.isArray(realDevices) ? realDevices : []);
                populateDevices();

                if (devices.length === 0) {
                    select.innerHTML = `<option value="">No storage devices found</option>`;
                } else if (previouslySelectedPath) {
                    const idx = deviceIndexByPath(previouslySelectedPath);
                    if (idx !== -1) {
                        const device = devices[idx];
                        const skipConfirm = device.removable
                            || (selectedDevice && selectedDevice.path === device.path);
                        select.value = idx;
                        selectDevice(select, { skipConfirm });
                    } else {
                        const defaultIdx = defaultDeviceIndex();
                        if (defaultIdx !== -1) {
                            select.value = defaultIdx;
                            selectDevice(select, { skipConfirm: true });
                        }
                    }
                } else {
                    const defaultIdx = defaultDeviceIndex();
                    if (defaultIdx !== -1) {
                        select.value = defaultIdx;
                        selectDevice(select, { skipConfirm: true });
                    }
                }

                console.log(`[lithographer] Loaded ${devices.length} storage device(s) from backend`);
            } catch (err) {
                console.error("Failed to load storage devices:", err);
                devices = [];
                populateDevices();
                select.innerHTML = `<option value="">Failed to query devices</option>`;
            }
        }

        function setOperationStatus(title, titleClass, detailHtml) {
            const statusEl = document.getElementById("status-text");
            statusEl.textContent = title;
            statusEl.className = titleClass;
            document.getElementById("status-detail").innerHTML = detailHtml;
        }

        function setProgressPercent(pct) {
            const clamped = Math.max(0, Math.min(100, pct));
            document.getElementById("progress-bar").style.width = `${clamped}%`;
            document.getElementById("progress-text").textContent = `${Math.floor(clamped)}%`;
        }

        function phaseLabel(phase) {
            const labels = {
                preparing: "Preparing",
                decompressing: "Decompressing",
                writing: "Writing",
                verifying: "Verifying",
                complete: "Complete",
                failed: "Failed",
            };
            return labels[phase] || (phase || "Working");
        }

        function handleLithoEvent(event) {
            const payload = event.payload;
            if (!payload || !payload.type) return;

            switch (payload.type) {
                case "status": {
                    const msg = payload.message || phaseLabel(payload.phase);
                    setOperationStatus(
                        "IN PROGRESS",
                        "text-amber-400 font-medium",
                        `<span class="font-medium">${phaseLabel(payload.phase)}</span> — ${msg}`
                    );
                    break;
                }
                case "progress": {
                    const label = phaseLabel(payload.phase);
                    const pct = typeof payload.pct === "number" ? payload.pct : null;
                    if (pct !== null) {
                        setProgressPercent(pct);
                    }
                    const detail = payload.message
                        || (pct !== null ? `${label} ${pct.toFixed(1)}%` : label);
                    setOperationStatus(
                        "IN PROGRESS",
                        "text-amber-400 font-medium",
                        detail
                    );
                    break;
                }
                case "error":
                    setOperationStatus(
                        "ERROR",
                        "text-red-400 font-medium",
                        payload.message || "Operation failed."
                    );
                    break;
                case "done":
                    if (payload.success) {
                        finishProcess();
                    } else {
                        failProcess(payload.message || "Operation failed.");
                    }
                    break;
                case "raw":
                    console.log(`[litho ${payload.stream}]`, payload.line);
                    break;
            }
        }

        async function ensureLithoEventListener() {
            if (lithoEventUnlisten || !window.__TAURI__?.event?.listen) return;
            lithoEventUnlisten = await window.__TAURI__.event.listen("litho-event", handleLithoEvent);
        }

        async function startProcess() {
            const needsFile = selectedMode === "flash"
                ? "Please select a device and a source image file."
                : "Please select a device and an output image path.";

            if (!selectedDevice || !selectedFile) {
                alert(needsFile);
                return;
            }

            if (isRunning) return;

            await ensureLithoEventListener();

            isRunning = true;
            updateVerifySection();
            document.getElementById("start-button").classList.add("opacity-50", "cursor-not-allowed");
            document.getElementById("cancel-button").classList.remove("hidden");
            setProgressPercent(0);

            const action = selectedMode === "flash" ? "Writing" : "Cloning";
            const target = selectedMode === "flash" ? selectedDevice.name : selectedFile.name;
            setOperationStatus(
                "STARTING",
                "text-amber-400 font-medium",
                `${action} <span class="font-medium">${target}</span>…`
            );

            try {
                await tauriInvoke("start_litho_operation", {
                    mode: selectedMode,
                    device: selectedDevice.path,
                    image: selectedFile.path,
                    verify: selectedMode === "flash"
                        && document.getElementById("verify-checkbox").checked,
                });
                setOperationStatus(
                    "IN PROGRESS",
                    "text-amber-400 font-medium",
                    "Waiting for litho sidecar…"
                );
            } catch (err) {
                console.error("Failed to start litho operation:", err);
                const message = err && err.message ? err.message : String(err);
                failProcess(message);
            }
        }

        function failProcess(message) {
            if (!isRunning) return;
            isRunning = false;
            updateVerifySection();
            document.getElementById("start-button").classList.remove("opacity-50", "cursor-not-allowed");
            document.getElementById("cancel-button").classList.add("hidden");
            setOperationStatus(
                "ERROR",
                "text-red-400 font-medium",
                message
            );
        }

        function finishProcess() {
            if (!isRunning) return;
            isRunning = false;
            updateVerifySection();
            document.getElementById("start-button").classList.remove("opacity-50", "cursor-not-allowed");
            document.getElementById("cancel-button").classList.add("hidden");

            const statusEl = document.getElementById("status-text");
            statusEl.textContent = "COMPLETE";
            statusEl.className = "text-emerald-400 font-medium";

            const verb = selectedMode === "flash" ? "flashed" : "cloned";
            const target = selectedMode === "flash" ? selectedDevice.name : selectedFile.name;
            document.getElementById("status-detail").innerHTML =
                `Successfully ${verb} <span class="font-medium">${target}</span>`;

            confettiBurst();
        }

        async function cancelProcess() {
            if (!isRunning) return;

            try {
                await tauriInvoke("cancel_litho_operation");
            } catch (err) {
                console.warn("Cancel request failed:", err);
            }

            isRunning = false;
            updateVerifySection();
            setProgressPercent(0);
            document.getElementById("start-button").classList.remove("opacity-50", "cursor-not-allowed");
            document.getElementById("cancel-button").classList.add("hidden");
            setOperationStatus(
                "CANCELLED",
                "text-orange-400 font-medium",
                "Operation cancelled by user."
            );
        }

        function confettiBurst() {
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement("div");
                    confetti.style.position = "fixed";
                    confetti.style.left = Math.random() * 100 + "vw";
                    confetti.style.top = "-10px";
                    confetti.style.width = "8px";
                    confetti.style.height = "8px";
                    confetti.style.borderRadius = "2px";
                    confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 90%, 65%)`;
                    confetti.style.zIndex = "9999";
                    confetti.style.opacity = "0.9";
                    document.body.appendChild(confetti);

                    let y = 0;
                    const fall = setInterval(() => {
                        y += 12 + Math.random() * 8;
                        confetti.style.transform = `translateY(${y}px) rotate(${y * 4}deg)`;
                        if (y > window.innerHeight) {
                            clearInterval(fall);
                            confetti.remove();
                        }
                    }, 16);
                }, i * 4);
            }
        }

        function getSystemTheme() {
            return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        }

        function getActiveTheme() {
            return document.documentElement.getAttribute("data-theme") || "dark";
        }

        function updateAppLogo(theme) {
            const logoEl = document.getElementById("app-logo");
            if (!logoEl) return;

            const logoSrc = theme === "dark" ? "assets/dark-logo.jpg" : "assets/light-logo.jpg";
            if (!logoEl.src.endsWith(logoSrc)) {
                logoEl.src = logoSrc;
            }
        }

        function updateThemeToggleIcon(theme) {
            const icon = document.getElementById("theme-icon");
            const btn = icon && icon.parentElement;
            if (!icon) return;

            if (theme === "dark") {
                icon.className = "fa-solid fa-sun text-amber-300";
                if (btn) btn.title = "Switch to light theme";
            } else {
                icon.className = "fa-solid fa-moon text-slate-600";
                if (btn) btn.title = "Switch to dark theme";
            }
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            try {
                localStorage.setItem(THEME_STORAGE_KEY, theme);
            } catch (_) {
                /* ignore private browsing */
            }
            updateAppLogo(theme);
            updateThemeToggleIcon(theme);
        }

        function initTheme() {
            let theme = null;
            try {
                theme = localStorage.getItem(THEME_STORAGE_KEY);
            } catch (_) {
                theme = null;
            }
            applyTheme(theme === "light" || theme === "dark" ? theme : getSystemTheme());
        }

        function toggleTheme() {
            applyTheme(getActiveTheme() === "dark" ? "light" : "dark");
        }

        async function applyLaunchParamsIfAny() {
            try {
                const params = await tauriInvoke("get_launch_params");
                const hasAny = params.mode || params.device || params.image;
                if (!hasAny) return;

                console.log("%c[launch] Applying CLI params:", "color:#60a5fa", params);

                if (params.mode) {
                    const wanted = String(params.mode).toLowerCase();
                    selectedMode = wanted === "clone" ? "clone" : "flash";
                    renderModes();
                    updateStartButton();
                    updateFileSection();
                    updateVerifySection();
                }

                if (params.device) {
                    let idx = deviceIndexByPath(params.device);

                    if (idx === -1) {
                        devices = sortDevicesRemovableFirst(devices.concat([{
                            name: basename(params.device),
                            path: params.device,
                            size: "Unknown size",
                            removable: false,
                            model: "From args"
                        }]));
                        populateDevices();
                        idx = deviceIndexByPath(params.device);
                    }

                    const select = document.getElementById("diskSelect");
                    select.value = idx;
                    selectDevice(select);
                }

                if (params.image) {
                    setSelectedFile(params.image);
                }
            } catch (err) {
                console.warn("Failed to read/apply launch params:", err);
            }
        }

        function handleKeyboard(e) {
            const modalOpen = pendingFixedDevice !== null;

            if (modalOpen) {
                if (e.key === "Escape") {
                    e.preventDefault();
                    confirmFixedDeviceSelection(false);
                } else if (e.key === "Enter") {
                    e.preventDefault();
                    confirmFixedDeviceSelection(true);
                }
                return;
            }

            if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
                e.preventDefault();
                document.getElementById("diskSelect").focus();
            }
        }

        window.onload = async function() {
            initTheme();
            renderModes();
            updateStartButton();
            updateFileSection();
            updateVerifySection();

            document.addEventListener("keydown", handleKeyboard);

            console.log("%cLithographer UI ✅", "color:#60a5fa; font-family:monospace; font-size:13px");

            loadPrivilegeStatus();
            await loadStorageDevices();
            await applyLaunchParamsIfAny();
            ensureLithoEventListener();
        };
    </script>
</body>
</html>
